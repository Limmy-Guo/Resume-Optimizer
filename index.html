<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Optimizer - AI-Powered</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function ResumeOptimizer() {
            const [jobDescription, setJobDescription] = useState('');
            const [currentResume, setCurrentResume] = useState('');
            const [improvedResume, setImprovedResume] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const optimizeResume = async () => {
                if (!jobDescription.trim() || !currentResume.trim()) {
                    setError('Please fill in both fields');
                    return;
                }

                setIsLoading(true);
                setError('');
                setImprovedResume('');

                try {
                    const response = await fetch('/api/optimize-resume', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ jobDescription, currentResume })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to optimize');
                    }

                    const data = await response.json();
                    setImprovedResume(data.improvedResume);
                } catch (err) {
                    setError(`Error: ${err.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50">
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        <div className="text-center mb-10">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <span className="text-5xl">✨</span>
                                <h1 className="text-4xl font-bold text-gray-900">Resume Optimizer</h1>
                            </div>
                            <p className="text-lg text-gray-600">Powered by Claude AI</p>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6 mb-8">
                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="text-2xl">💼</span>
                                    <label className="text-lg font-semibold">Job Description</label>
                                </div>
                                <textarea
                                    value={jobDescription}
                                    onChange={(e) => setJobDescription(e.target.value)}
                                    placeholder="Paste the job description here..."
                                    className="w-full h-80 p-4 border rounded-lg focus:ring-2 focus:ring-blue-500 resize-none"
                                />
                                <p className="text-sm text-gray-500 mt-2">{jobDescription.length} characters</p>
                            </div>

                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="text-2xl">📄</span>
                                    <label className="text-lg font-semibold">Current Resume</label>
                                </div>
                                <textarea
                                    value={currentResume}
                                    onChange={(e) => setCurrentResume(e.target.value)}
                                    placeholder="Paste your resume here..."
                                    className="w-full h-80 p-4 border rounded-lg focus:ring-2 focus:ring-purple-500 resize-none"
                                />
                                <p className="text-sm text-gray-500 mt-2">{currentResume.length} characters</p>
                            </div>
                        </div>

                        <div className="text-center mb-8">
                            <button
                                onClick={optimizeResume}
                                disabled={isLoading}
                                className="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-10 py-4 rounded-lg font-semibold text-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {isLoading ? '✨ Optimizing...' : '✨ Optimize Resume'}
                            </button>
                        </div>

                        {error && (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                <p className="text-red-700">⚠️ {error}</p>
                            </div>
                        )}

                        {improvedResume && (
                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-2">
                                        <span className="text-2xl">✅</span>
                                        <label className="text-lg font-semibold">Improved Resume</label>
                                    </div>
                                    <button
                                        onClick={() => {
                                            navigator.clipboard.writeText(improvedResume);
                                            alert('Copied!');
                                        }}
                                        className="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200"
                                    >
                                        📋 Copy
                                    </button>
                                </div>
                                <div className="bg-gray-50 rounded-lg p-6 border">
                                    <pre className="whitespace-pre-wrap font-sans text-gray-800 leading-relaxed">
                                        {improvedResume}
                                    </pre>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ResumeOptimizer />, document.getElementById('root'));
    </script>
</body>
</html>
