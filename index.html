<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <div class="flex items-center justify-center gap-3 mb-4">
                <span class="text-5xl">✨</span>
                <h1 class="text-4xl font-bold text-gray-900">Resume Optimizer</h1>
            </div>
            <p class="text-lg text-gray-600">Powered by Claude AI</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center gap-2 mb-4">
                    <span class="text-2xl">💼</span>
                    <label class="text-lg font-semibold">Job Description</label>
                </div>
                <textarea 
                    id="jobDescription"
                    placeholder="Paste the job description here..."
                    class="w-full h-80 p-4 border rounded-lg focus:ring-2 focus:ring-blue-500 resize-none"
                ></textarea>
                <p class="text-sm text-gray-500 mt-2"><span id="jdCount">0</span> characters</p>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center gap-2 mb-4">
                    <span class="text-2xl">📄</span>
                    <label class="text-lg font-semibold">Current Resume</label>
                </div>
                <textarea 
                    id="currentResume"
                    placeholder="Paste your resume here..."
                    class="w-full h-80 p-4 border rounded-lg focus:ring-2 focus:ring-purple-500 resize-none"
                ></textarea>
                <p class="text-sm text-gray-500 mt-2"><span id="resumeCount">0</span> characters</p>
            </div>
        </div>

        <div class="text-center mb-8">
            <button 
                onclick="optimizeResume()" 
                id="optimizeBtn"
                class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-10 py-4 rounded-lg font-semibold text-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition-all disabled:opacity-50"
            >
                ✨ Optimize Resume
            </button>
        </div>

        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
            <p class="text-red-700"></p>
        </div>

        <div id="loadingMessage" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
            <p class="text-blue-700">✨ Optimizing... This may take 10-30 seconds.</p>
        </div>

        <div id="resultSection" class="hidden bg-white rounded-xl shadow-lg p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">✅</span>
                    <label class="text-lg font-semibold">Improved Resume</label>
                </div>
                <button 
                    onclick="copyResult()"
                    class="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200"
                >
                    📋 Copy
                </button>
            </div>
            <div class="bg-gray-50 rounded-lg p-6 border">
                <pre id="resultText" class="whitespace-pre-wrap font-sans text-gray-800 leading-relaxed"></pre>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('jobDescription').addEventListener('input', (e) => {
            document.getElementById('jdCount').textContent = e.target.value.length;
        });
        document.getElementById('currentResume').addEventListener('input', (e) => {
            document.getElementById('resumeCount').textContent = e.target.value.length;
        });

        async function optimizeResume() {
            const jobDescription = document.getElementById('jobDescription').value.trim();
            const currentResume = document.getElementById('currentResume').value.trim();

            if (!jobDescription || !currentResume) {
                showError('Please fill in both fields');
                return;
            }

            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('loadingMessage').classList.remove('hidden');
            const btn = document.getElementById('optimizeBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Optimizing...';

            try {
                const response = await fetch('/api/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jobDescription, currentResume })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.details || 'Request failed');
                }

                document.getElementById('resultText').textContent = data.improvedResume;
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('loadingMessage').classList.add('hidden');

            } catch (error) {
                showError(`Error: ${error.message}`);
                document.getElementById('loadingMessage').classList.add('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ Optimize Resume';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.querySelector('p').textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('resultText').textContent);
            alert('Copied to clipboard!');
        }
    </script>
</body>
</html>
