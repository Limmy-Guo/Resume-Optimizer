<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Optimizer - AI-Powered Resume Enhancement</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function ResumeOptimizer() {
            const [jobDescription, setJobDescription] = useState('');
            const [currentResume, setCurrentResume] = useState('');
            const [improvedResume, setImprovedResume] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const optimizeResume = async () => {
                if (!jobDescription.trim() || !currentResume.trim()) {
                    setError('Please fill in both the job description and your current resume.');
                    return;
                }

                setIsLoading(true);
                setError('');
                setImprovedResume('');

                try {
                    // 调用 Netlify Function
                    const response = await fetch('/.netlify/functions/optimize-resume', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            jobDescription,
                            currentResume
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to optimize resume');
                    }

                    const data = await response.json();
                    
                    if (data.improvedResume) {
                        setImprovedResume(data.improvedResume);
                    } else {
                        setError('Unable to generate improved resume. Please try again.');
                    }
                } catch (err) {
                    setError(`Error: ${err.message}. Please try again.`);
                    console.error('Error:', err);
                } finally {
                    setIsLoading(false);
                }
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(improvedResume);
                alert('Copied to clipboard!');
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50">
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        {/* Header */}
                        <div className="text-center mb-10">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <span className="text-5xl">✨</span>
                                <h1 className="text-4xl font-bold text-gray-900">Resume Optimizer</h1>
                            </div>
                            <p className="text-lg text-gray-600">
                                Powered by Claude AI to tailor your resume for any job
                            </p>
                        </div>

                        {/* Input Section */}
                        <div className="grid md:grid-cols-2 gap-6 mb-8">
                            {/* Job Description Input */}
                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="text-2xl">💼</span>
                                    <label className="text-lg font-semibold text-gray-800">
                                        Job Description
                                    </label>
                                </div>
                                <textarea
                                    value={jobDescription}
                                    onChange={(e) => setJobDescription(e.target.value)}
                                    placeholder="Paste the job description here..."
                                    className="w-full h-80 p-4 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none text-gray-700"
                                />
                                <p className="text-sm text-gray-500 mt-2">
                                    {jobDescription.length} characters
                                </p>
                            </div>

                            {/* Current Resume Input */}
                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="text-2xl">📄</span>
                                    <label className="text-lg font-semibold text-gray-800">
                                        Current Resume
                                    </label>
                                </div>
                                <textarea
                                    value={currentResume}
                                    onChange={(e) => setCurrentResume(e.target.value)}
                                    placeholder="Paste your current resume here..."
                                    className="w-full h-80 p-4 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none text-gray-700"
                                />
                                <p className="text-sm text-gray-500 mt-2">
                                    {currentResume.length} characters
                                </p>
                            </div>
                        </div>

                        {/* Optimize Button */}
                        <div className="text-center mb-8">
                            <button
                                onClick={optimizeResume}
                                disabled={isLoading}
                                className="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-10 py-4 rounded-lg font-semibold text-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                            >
                                {isLoading ? (
                                    <span className="flex items-center gap-2">
                                        <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        Optimizing Your Resume...
                                    </span>
                                ) : (
                                    '✨ Optimize Resume'
                                )}
                            </button>
                        </div>

                        {/* Error Message */}
                        {error && (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 flex items-start gap-3">
                                <span className="text-2xl">⚠️</span>
                                <p className="text-red-700">{error}</p>
                            </div>
                        )}

                        {/* Output Section */}
                        {improvedResume && (
                            <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-2">
                                        <span className="text-2xl">✅</span>
                                        <label className="text-lg font-semibold text-gray-800">
                                            Improved Resume
                                        </label>
                                    </div>
                                    <button
                                        onClick={copyToClipboard}
                                        className="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors font-medium"
                                    >
                                        📋 Copy to Clipboard
                                    </button>
                                </div>
                                <div className="bg-gray-50 rounded-lg p-6 border border-gray-200">
                                    <pre className="whitespace-pre-wrap font-sans text-gray-800 leading-relaxed">
                                        {improvedResume}
                                    </pre>
                                </div>
                            </div>
                        )}

                        {/* Tips Section */}
                        <div className="mt-10 bg-blue-50 border border-blue-100 rounded-xl p-6">
                            <h3 className="text-lg font-semibold text-gray-800 mb-3">
                                💡 Tips for Best Results
                            </h3>
                            <ul className="space-y-2 text-gray-700">
                                <li>• Paste the complete job description including requirements and responsibilities</li>
                                <li>• Include your full resume with all relevant experience and skills</li>
                                <li>• Review the optimized resume and adjust as needed for accuracy</li>
                                <li>• Use the improved resume as a starting point and personalize further</li>
                            </ul>
                        </div>

                        {/* Footer */}
                        <div className="mt-8 text-center text-gray-500 text-sm">
                            <p>Powered by Claude AI • Deployed on Netlify</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ResumeOptimizer />, document.getElementById('root'));
    </script>
</body>
</html>
